<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title desc">
  <title id="title">Tier-Sudoku Feature-Grafik</title>
  <desc id="desc">Freundliche grün-cremefarbene Grafik mit App-Titel, Unterzeile, Tieren und Sudoku-Pfotenlogo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fcf9"/>
      <stop offset="1" stop-color="#fff2d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#234a3a" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="916" cy="65" r="150" fill="#e6f3eb"/>
  <circle cx="92" cy="474" r="130" fill="#ffe1d8"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#234a3a">
    <text x="72" y="202" font-size="72" font-weight="700">Tier-Sudoku</text>
    <text x="76" y="255" font-size="27" fill="#566961">Spielen · Lernen · Spaß</text>
  </g>
  <g transform="translate(76 300)">
    <rect width="420" height="60" rx="30" fill="#39765b"/>
    <text x="210" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#fff">Offline · Werbefrei · Kinderfreundlich</text>
  </g>

  <g transform="translate(585 75)" filter="url(#shadow)">
    <rect width="340" height="340" rx="62" fill="#234a3a"/>
    <rect x="48" y="48" width="244" height="244" rx="38" fill="#fff8e7"/>
    <g fill="none" stroke="#39765b" stroke-width="12">
      <path d="M129 48v244M211 48v244M48 129h244M48 211h244"/>
    </g>
    <g fill="#f47c6c">
      <ellipse cx="170" cy="190" rx="36" ry="44"/>
      <ellipse cx="112" cy="152" rx="19" ry="25" transform="rotate(-28 112 152)"/>
      <ellipse cx="147" cy="123" rx="19" ry="25" transform="rotate(-10 147 123)"/>
      <ellipse cx="193" cy="123" rx="19" ry="25" transform="rotate(10 193 123)"/>
      <ellipse cx="228" cy="152" rx="19" ry="25" transform="rotate(28 228 152)"/>
    </g>
  </g>

  <g transform="translate(470 350)">
    <circle cx="0" cy="0" r="43" fill="#d99a62"/><circle cx="-14" cy="-5" r="4" fill="#293e37"/><circle cx="14" cy="-5" r="4" fill="#293e37"/>
    <circle cx="500" cy="0" r="43" fill="#4e91c7"/><circle cx="486" cy="-5" r="4" fill="#243d45"/><path d="M500 10q14 12 26 0" fill="none" stroke="#fff" stroke-width="4"/>
  </g>
</svg>
